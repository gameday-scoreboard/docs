name: Publish

# Build docs.gameday-scoreboard.com from the firmware repo's main branch and
# deploy it to this repo's GitHub Pages site. The pages are in
# gameday-scoreboard/gameday-scoreboard under docs/wiki; nothing here is
# edited to change the site.
#
# Runs every 15 minutes and skips when main hasn't moved since the last
# publish: the deployed site carries main's commit in /version.txt, and the
# check compares it with the live copy. A run by hand always publishes, and
# can publish another branch of the firmware repo for a while, with a
# warning, since the live docs then describe that branch.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch of the firmware repo to publish (main unless the live docs should describe another branch for a while)
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SOURCE_REPO: gameday-scoreboard/gameday-scoreboard
  SITE: https://docs.gameday-scoreboard.com

jobs:
  check:
    name: Has main moved
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.compare.outputs.go }}
      sha: ${{ steps.compare.outputs.sha }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          REF: ${{ inputs.ref || 'main' }}
        run: |
          set -euo pipefail
          if [ "$REF" != main ]; then
            echo "::warning::Publishing the firmware repo's $REF branch, not main, so the live docs describe that branch until the next publish of main."
          fi
          sha=$(gh api "repos/$SOURCE_REPO/commits/$REF" --jq .sha)
          live=$(curl -fsSL "$SITE/version.txt?run=$GITHUB_RUN_ID" 2>/dev/null || echo none)
          echo "$REF is $sha, live is $live"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" = true ] || [ "$live" != "$sha" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Up to date, nothing to publish."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build docs
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: gameday-scoreboard/gameday-scoreboard
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/wiki/package-lock.json
      - name: Install
        working-directory: docs/wiki
        run: npm ci
      - name: Build
        working-directory: docs/wiki
        run: npm run build
      - name: Stamp the build with its source commit
        run: echo "${{ needs.check.outputs.sha }}" > docs/wiki/dist/version.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/wiki/dist

  deploy:
    name: Publish to GitHub Pages
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: The docs are live
        env:
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          set -uo pipefail
          got=none
          for i in $(seq 1 12); do
            got=$(curl -fsSL "$SITE/version.txt?run=$GITHUB_RUN_ID-$i" 2>/dev/null || echo none)
            if [ "$got" = "$SHA" ]; then echo "Live: $SITE at $SHA"; exit 0; fi
            echo "try $i: live has $got"
            sleep 15
          done
          if ! getent hosts docs.gameday-scoreboard.com >/dev/null; then
            echo "::warning::docs.gameday-scoreboard.com has no DNS record yet, so the live check was skipped. The deploy itself succeeded."
            exit 0
          fi
          echo "::error::$SITE still serves $got three minutes after deploying $SHA"
          exit 1
